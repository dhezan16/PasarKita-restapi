$kind: http-request
url: "{{baseUrl}}/api/pesanan.php?id={{orderId}}"
method: GET
queryParams:
  id: "{{orderId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Content-Type application/json", () => pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"));
      const body = pm.response.json();
      pm.test("Format response konsisten (success, message, data)", () => {
        pm.expect(body).to.have.property("success");
        pm.expect(body).to.have.property("message");
        pm.expect(body).to.have.property("data");
      });
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Pesanan tersimpan di orders & order_details", () => { pm.expect(body.data.id).to.eql(Number(pm.collectionVariables.get("orderId"))); pm.expect(body.data.items).to.have.lengthOf(1); pm.expect(body.data.items[0].jumlah).to.eql(2); });
    language: text/javascript
order: 3000
