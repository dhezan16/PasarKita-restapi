$kind: http-request
url: "{{baseUrl}}/api/produk.php?id={{produkId}}"
method: GET
queryParams:
  id: "{{produkId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Content-Type application/json", () => pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"));
      const body = pm.response.json();
      pm.test("Format response konsisten (success, message, data)", () => {
        pm.expect(body).to.have.property("success");
        pm.expect(body).to.have.property("message");
        pm.expect(body).to.have.property("data");
      });
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Stok berkurang 2", () => pm.expect(body.data.stok).to.eql(Number(pm.collectionVariables.get("stokAwal")) - 2));
      pm.collectionVariables.set("stokSetelahPesan", body.data.stok);
      pm.collectionVariables.set("jumlahMelebihiStok", body.data.stok + 1);
    language: text/javascript
order: 2000
