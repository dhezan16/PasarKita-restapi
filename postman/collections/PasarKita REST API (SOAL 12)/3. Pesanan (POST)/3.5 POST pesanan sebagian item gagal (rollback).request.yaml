$kind: http-request
description: Item pertama valid, item kedua stok habis -> seluruh pesanan dibatalkan (ROLLBACK).
url: "{{baseUrl}}/api/pesanan.php"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "produk": [
        {
          "produk_id": {{produkId}},
          "jumlah": 1
        },
        {
          "produk_id": {{produkHabisId}},
          "jumlah": 1
        }
      ],
      "alamat_pengiriman": "Jl. Merdeka No. 10, Bandung, Jawa Barat 40111"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Content-Type application/json", () => pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"));
      const body = pm.response.json();
      pm.test("Format response konsisten (success, message, data)", () => {
        pm.expect(body).to.have.property("success");
        pm.expect(body).to.have.property("message");
        pm.expect(body).to.have.property("data");
      });
      pm.test("Status 422", () => pm.response.to.have.status(422));pm.test("success = false", () => pm.expect(body.success).to.eql(false));
    language: text/javascript
order: 5000
