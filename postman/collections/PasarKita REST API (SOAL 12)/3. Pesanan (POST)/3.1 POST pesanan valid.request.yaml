$kind: http-request
description: "Uji 5: pesanan valid. Field harga & total sengaja dikirim untuk membuktikan server mengabaikannya."
url: "{{baseUrl}}/api/pesanan.php"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "produk": [
        {
          "produk_id": {{produkId}},
          "jumlah": 2
        }
      ],
      "nama_penerima": "Siti Pembeli",
      "telepon": "081234567890",
      "alamat_pengiriman": "Jl. Merdeka No. 10, Bandung, Jawa Barat 40111",
      "catatan": "Uji Postman",
      "metode_pembayaran": "transfer",
      "harga": 1,
      "total": 1000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Content-Type application/json", () => pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"));
      const body = pm.response.json();
      pm.test("Format response konsisten (success, message, data)", () => {
        pm.expect(body).to.have.property("success");
        pm.expect(body).to.have.property("message");
        pm.expect(body).to.have.property("data");
      });
      pm.test("Status 201", () => pm.response.to.have.status(201));pm.test("success = true", () => pm.expect(body.success).to.eql(true));
      pm.test("Mengembalikan ID & kode pesanan", () => { pm.expect(body.data.id).to.be.a("number"); pm.expect(body.data.kode_pesanan).to.match(/^PK\d{6}[0-9A-F]{6}$/); });
      const harga = Number(pm.collectionVariables.get("produkHarga"));
      pm.test("Total dihitung server dari harga database (bukan dari client)", () => {
        pm.expect(body.data.items[0].harga).to.eql(harga);
        pm.expect(body.data.subtotal).to.eql(harga * 2);
        pm.expect(body.data.total).to.eql(harga * 2 + body.data.ongkos_kirim);
      });
      pm.test("Status awal pending", () => pm.expect(body.data.status).to.eql("pending"));
      pm.collectionVariables.set("orderId", body.data.id);
    language: text/javascript
order: 1000
