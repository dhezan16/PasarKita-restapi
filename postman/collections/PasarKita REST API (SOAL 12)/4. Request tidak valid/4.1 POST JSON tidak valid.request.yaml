$kind: http-request
description: "Uji 7: JSON rusak -> 400."
url: "{{baseUrl}}/api/pesanan.php"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"produk": [ {"produk_id": 1, "jumlah": 2 }'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Content-Type application/json", () => pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"));
      const body = pm.response.json();
      pm.test("Format response konsisten (success, message, data)", () => {
        pm.expect(body).to.have.property("success");
        pm.expect(body).to.have.property("message");
        pm.expect(body).to.have.property("data");
      });
      pm.test("Status 400", () => pm.response.to.have.status(400));pm.test("success = false", () => pm.expect(body.success).to.eql(false));
      pm.test("Pesan format JSON tidak valid", () => pm.expect(body.message).to.include("JSON tidak valid"));
    language: text/javascript
order: 1000
