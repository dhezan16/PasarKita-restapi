$kind: http-request
url: "{{baseUrl}}/api/pesanan.php"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
body:
  type: text
  content: produk_id=1&jumlah=2
scripts:
  - type: afterResponse
    code: |-
      pm.test("Content-Type application/json", () => pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"));
      const body = pm.response.json();
      pm.test("Format response konsisten (success, message, data)", () => {
        pm.expect(body).to.have.property("success");
        pm.expect(body).to.have.property("message");
        pm.expect(body).to.have.property("data");
      });
      pm.test("Status 415", () => pm.response.to.have.status(415));pm.test("success = false", () => pm.expect(body.success).to.eql(false));
    language: text/javascript
order: 4000
