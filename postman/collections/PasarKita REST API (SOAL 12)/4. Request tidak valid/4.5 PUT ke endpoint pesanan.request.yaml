$kind: http-request
description: "Uji 8: method tidak sesuai -> 405."
url: "{{baseUrl}}/api/pesanan.php"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "produk": [
        {
          "produk_id": 1,
          "jumlah": 1
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Content-Type application/json", () => pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"));
      const body = pm.response.json();
      pm.test("Format response konsisten (success, message, data)", () => {
        pm.expect(body).to.have.property("success");
        pm.expect(body).to.have.property("message");
        pm.expect(body).to.have.property("data");
      });
      pm.test("Status 405", () => pm.response.to.have.status(405));pm.test("success = false", () => pm.expect(body.success).to.eql(false));
      pm.test("Header Allow tersedia", () => pm.expect(pm.response.headers.get("Allow")).to.include("POST"));
    language: text/javascript
order: 5000
