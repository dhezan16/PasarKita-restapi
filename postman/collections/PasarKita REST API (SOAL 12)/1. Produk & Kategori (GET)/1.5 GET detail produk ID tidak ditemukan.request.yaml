$kind: http-request
description: "Uji 3: ID tidak ada -> 404."
url: "{{baseUrl}}/api/produk.php?id=999999"
method: GET
queryParams:
  id: "999999"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Content-Type application/json", () => pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"));
      const body = pm.response.json();
      pm.test("Format response konsisten (success, message, data)", () => {
        pm.expect(body).to.have.property("success");
        pm.expect(body).to.have.property("message");
        pm.expect(body).to.have.property("data");
      });
      pm.test("Status 404", () => pm.response.to.have.status(404));pm.test("success = false", () => pm.expect(body.success).to.eql(false));
      pm.test("Pesan 'Produk tidak ditemukan' & data null", () => { pm.expect(body.message).to.eql("Produk tidak ditemukan"); pm.expect(body.data).to.be.null; });
    language: text/javascript
order: 5000
