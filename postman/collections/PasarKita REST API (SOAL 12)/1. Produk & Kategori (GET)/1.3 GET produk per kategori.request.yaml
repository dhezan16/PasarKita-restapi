$kind: http-request
url: "{{baseUrl}}/api/produk.php?kategori=batik-tenun"
method: GET
queryParams:
  kategori: batik-tenun
scripts:
  - type: afterResponse
    code: |-
      pm.test("Content-Type application/json", () => pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"));
      const body = pm.response.json();
      pm.test("Format response konsisten (success, message, data)", () => {
        pm.expect(body).to.have.property("success");
        pm.expect(body).to.have.property("message");
        pm.expect(body).to.have.property("data");
      });
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Semua produk berkategori batik-tenun", () => body.data.forEach(p => pm.expect(p.kategori.slug).to.eql("batik-tenun")));
    language: text/javascript
order: 3000
