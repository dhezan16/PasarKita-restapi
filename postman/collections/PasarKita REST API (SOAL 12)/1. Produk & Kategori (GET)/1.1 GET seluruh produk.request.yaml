$kind: http-request
description: "Uji 1: mengambil seluruh produk aktif beserta nama kategori."
url: "{{baseUrl}}/api/produk.php?limit=100"
method: GET
queryParams:
  limit: "100"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Content-Type application/json", () => pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"));
      const body = pm.response.json();
      pm.test("Format response konsisten (success, message, data)", () => {
        pm.expect(body).to.have.property("success");
        pm.expect(body).to.have.property("message");
        pm.expect(body).to.have.property("data");
      });
      pm.test("Status 200", () => pm.response.to.have.status(200));pm.test("success = true", () => pm.expect(body.success).to.eql(true));
      pm.test("data berupa array & tidak kosong", () => { pm.expect(body.data).to.be.an("array").that.is.not.empty; });
      pm.test("Setiap produk memiliki nama kategori", () => body.data.forEach(p => pm.expect(p.kategori.nama).to.be.a("string").and.not.empty));
      pm.test("meta.total = jumlah data", () => pm.expect(body.meta.total).to.eql(body.data.length));
      // simpan produk dengan stok terbanyak (untuk uji pesanan) & produk stok habis
      const sorted = body.data.slice().sort((a, b) => b.stok - a.stok);
      pm.collectionVariables.set("produkId", sorted[0].id);
      pm.collectionVariables.set("produkHarga", sorted[0].harga);
      const habis = body.data.find(p => p.stok === 0);
      if (habis) pm.collectionVariables.set("produkHabisId", habis.id);
    language: text/javascript
order: 1000
