$kind: http-request
description: "Uji 2: detail produk berdasarkan ID."
url: "{{baseUrl}}/api/produk.php?id={{produkId}}"
method: GET
queryParams:
  id: "{{produkId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Content-Type application/json", () => pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"));
      const body = pm.response.json();
      pm.test("Format response konsisten (success, message, data)", () => {
        pm.expect(body).to.have.property("success");
        pm.expect(body).to.have.property("message");
        pm.expect(body).to.have.property("data");
      });
      pm.test("Status 200", () => pm.response.to.have.status(200));pm.test("success = true", () => pm.expect(body.success).to.eql(true));
      pm.test("ID sesuai permintaan", () => pm.expect(body.data.id).to.eql(Number(pm.collectionVariables.get("produkId"))));
      pm.test("Memuat deskripsi, harga, stok, kategori", () => { pm.expect(body.data).to.include.keys("deskripsi", "harga", "stok", "kategori"); });
      pm.collectionVariables.set("stokAwal", body.data.stok);
    language: text/javascript
order: 4000
